<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מחולל בינגו מקצועי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&family=Heebo:wght@500;800&family=Varela+Round&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6c5ce7;
      --primary-dark: #a29bfe;
      --accent: #00cec9;
      --danger: #ff7675;
      --bg: #f0f3f7;
      --card-bg: #ffffff;
      --text-main: #2d3436;
      --text-sub: #636e72;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    /* תיקון קריטי להדפסת צבעים ורקעים */
    * { 
      box-sizing: border-box; 
      -webkit-print-color-adjust: exact !important; 
      print-color-adjust: exact !important; 
    }

    body {
      font-family: 'Assistant', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0; padding: 20px;
      line-height: 1.6;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-weight: 800; font-size: 2.5rem; color: var(--primary); margin: 0; }
    header p { color: var(--text-sub); margin-top: 5px; }

    .setup-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
      margin-bottom: 30px;
    }

    .section-title {
      font-weight: 700; font-size: 1.1rem;
      margin-bottom: 20px; color: var(--primary);
      display: flex; align-items: center; gap: 10px;
    }

    .grid-settings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .field { display: flex; flex-direction: column; gap: 8px; }
    label { font-weight: 600; font-size: 0.9rem; color: var(--text-sub); }
    
    input[type="text"], input[type="number"], select, textarea {
      padding: 12px 15px;
      border: 2px solid #edf2f7;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s;
      outline: none;
    }

    .color-input-wrapper { display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 8px; border-radius: 10px; border: 2px solid #edf2f7; }
    input[type="color"] { border: none; width: 40px; height: 40px; cursor: pointer; background: none; }

    .input-group { display: flex; gap: 10px; margin-top: 10px; }
    .input-group input { flex: 1; }

    .btn {
      padding: 12px 25px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #5b4bc4; transform: translateY(-2px); }
    .btn-accent { background: var(--accent); color: white; }
    .btn-outline { background: transparent; border: 2px solid #edf2f7; color: var(--text-sub); }

    .pool-container { margin-top: 30px; padding-top: 20px; border-top: 1px solid #edf2f7; }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      max-height: 250px;
      overflow-y: auto;
      padding: 10px;
      background: #fdfdfd;
      border-radius: 10px;
    }
    .chip {
      background: white; border: 1px solid #edf2f7;
      padding: 8px; border-radius: 8px;
      display: flex; align-items: center; gap: 8px;
      font-size: 0.9rem;
    }
    .chip img { width: 35px; height: 35px; object-fit: cover; border-radius: 5px; }
    .chip .remove { margin-right: auto; color: var(--danger); cursor: pointer; font-weight: bold; }

    .dropzone {
      border: 2px dashed #cbd5e0;
      background: #f8fafc;
      padding: 30px;
      text-align: center;
      border-radius: var(--radius);
      cursor: pointer;
      margin: 20px 0;
    }

    /* עיצוב הלוחות להדפסה */
    .bingo-board {
      background-color: white; 
      background-size: cover; 
      background-position: center;
      width: 19cm; 
      min-height: 25cm;
      margin: 40px auto; 
      padding: 25px;
      border-radius: 15px; 
      border: 5px solid #2d3436;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      page-break-after: always;
      display: flex;
      flex-direction: column;
    }

    .board-header {
      text-align: center; 
      font-size: 36px; 
      font-weight: 800;
      color: white; 
      padding: 15px; 
      border-radius: 12px;
      margin-bottom: 25px; 
      text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }

    .grid-table { 
      display: grid; 
      gap: 12px; 
      flex-grow: 1;
    }

    .cell {
      aspect-ratio: 1; 
      border: 2px solid #2d3436;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 10px; 
      display: flex; 
      align-items: center;
      justify-content: center; 
      text-align: center; 
      padding: 10px;
    }

    .cell img { max-width: 90%; max-height: 90%; object-fit: contain; }

    .caller-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
    }

    .caller-card {
      border: 2px dashed var(--primary); 
      border-radius: 10px;
      padding: 20px; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      height: 5cm; 
      background: white;
      page-break-inside: avoid;
    }

    .caller-card img { max-height: 100%; max-width: 100%; object-fit: contain; }

    #loader {
      display: none; position: fixed; inset: 0;
      background: rgba(255,255,255,0.9); z-index: 1000;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media print {
      .no-print { display: none !important; }
      body { padding: 0; background: white; }
      .bingo-board { 
        margin: 0 auto; 
        box-shadow: none; 
        border-width: 4px;
        width: 18cm; /* התאמה לדף A4 */
      }
      @page { size: A4; margin: 10mm; }
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <p style="font-weight: 700; margin-top: 15px;">יוצר את הקסם, רק רגע...</p>
</div>

<div class="container">
  <header class="no-print">
    <h1>🎲 מחולל הבינגו שלי</h1>
    <p>צרו לוחות בינגו מעוצבים עם תמונות ומילים בתוך דקות</p>
  </header>

  <div class="setup-card no-print">
    <div class="section-title">⚙️ הגדרות משחק</div>
    <div class="grid-settings">
      <div class="field">
        <label>כותרת המשחק</label>
        <input type="text" id="gameTitle" value="בינגו כיפי!">
      </div>
      <div class="field">
        <label>גודל הלוח</label>
        <select id="gridSize">
          <option value="3">3x3</option>
          <option value="4" selected>4x4</option>
          <option value="5">5x5</option>
        </select>
      </div>
      <div class="field">
        <label>מספר לוחות</label>
        <input type="number" id="boardCount" value="5" min="1">
      </div>
    </div>

    <div class="section-title">🎨 עיצוב ונראות</div>
    <div class="grid-settings">
      <div class="field">
        <label>צבע כותרת</label>
        <div class="color-input-wrapper">
          <input type="color" id="headerColor" value="#6c5ce7">
          <span>בחר צבע</span>
        </div>
      </div>
      <div class="field">
        <label>צבע מילים</label>
        <div class="color-input-wrapper">
          <input type="color" id="wordColor" value="#2d3436" onchange="renderPreview()">
          <span>בחר צבע</span>
        </div>
      </div>
      <div class="field">
        <label>פונט</label>
        <select id="fontFamily" onchange="renderPreview()">
          <option value="'Assistant', sans-serif">Assistant</option>
          <option value="'Heebo', sans-serif">Heebo</option>
          <option value="'Varela Round', sans-serif">Varela Round</option>
          <option value="Arial">Arial</option>
        </select>
      </div>
      <div class="field">
        <label>רקע הלוח</label>
        <input type="file" id="bgInput" accept="image/*">
      </div>
    </div>

    <div class="section-title">📝 תוכן</div>
    <div class="field">
      <label>הכנס מילים (מופרדות בפסיק):</label>
      <div class="input-group">
        <input type="text" id="textInput" placeholder="שוקולד, עוגה, גלידה...">
        <button class="btn btn-accent" onclick="addWords()">➕ הוסף למאגר</button>
      </div>
    </div>

    <div class="dropzone" onclick="document.getElementById('fileInput').click()">
      <p style="font-weight: 700; color: var(--primary);">🖼️ לחצו כאן להעלאת תמונות</p>
      <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
    </div>

    <div class="pool-container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <label>מאגר: <span id="poolCounter" style="color: var(--primary);">0</span></label>
        <button class="btn-outline" style="padding: 5px 10px;" onclick="clearPool()">🗑️ נקה הכל</button>
      </div>
      <div id="poolPreview" class="items-grid"></div>
    </div>

    <div style="display: flex; gap: 15px; margin-top: 40px;">
      <button class="btn btn-primary" style="flex: 2;" onclick="generate()">🎲 צור לוחות בינגו</button>
      <button class="btn btn-outline" style="flex: 1;" onclick="window.print()">🖨️ הדפס / שמור ל-PDF</button>
    </div>
  </div>

  <div id="boardsOutput"></div>
  <div id="callerOutput"></div>
</div>

<script>
  let pool = [];
  let boardBg = null;

  document.getElementById('bgInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = evt => boardBg = evt.target.result;
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('fileInput').addEventListener('change', async e => {
    const files = Array.from(e.target.files);
    setLoading(true);
    for (const file of files) {
      const data = await toBase64(file);
      pool.push({ type: 'img', value: data });
    }
    renderPreview();
    setLoading(false);
    e.target.value = '';
  });

  function addWords() {
    const input = document.getElementById('textInput');
    const words = input.value.split(/[,，\n]+/).map(w => w.trim()).filter(w => w);
    words.forEach(w => pool.push({ type: 'text', value: w }));
    input.value = '';
    renderPreview();
  }

  function renderPreview() {
    const container = document.getElementById('poolPreview');
    const color = document.getElementById('wordColor').value;
    const font = document.getElementById('fontFamily').value;
    container.innerHTML = '';
    pool.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'chip';
      if (item.type === 'img') {
        div.innerHTML = `<img src="${item.value}"> <span>תמונה</span>`;
      } else {
        div.innerHTML = `<span style="color:${color}; font-family:${font}; font-weight:700;">${item.value}</span>`;
      }
      const del = document.createElement('span');
      del.className = 'remove';
      del.innerHTML = ' ✕';
      del.onclick = () => { pool.splice(idx, 1); renderPreview(); };
      div.appendChild(del);
      container.appendChild(div);
    });
    document.getElementById('poolCounter').textContent = pool.length;
  }

  function generate() {
    const size = parseInt(document.getElementById('gridSize').value);
    const count = parseInt(document.getElementById('boardCount').value);
    const needed = size * size;

    if (pool.length < needed) {
      alert(`חסרים פריטים! צריך לפחות ${needed} (כרגע יש ${pool.length})`);
      return;
    }

    setLoading(true);
    setTimeout(() => {
      const boardsOut = document.getElementById('boardsOutput');
      const callerOut = document.getElementById('callerOutput');
      const hColor = document.getElementById('headerColor').value;
      const wColor = document.getElementById('wordColor').value;
      const font = document.getElementById('fontFamily').value;
      const title = document.getElementById('gameTitle').value;

      boardsOut.innerHTML = '';
      callerOut.innerHTML = '<h2 class="no-print" style="text-align:center; margin-top:50px;">📣 כרטיסי הגרלה</h2>';
      
      const callerGrid = document.createElement('div');
      callerGrid.className = 'caller-grid';

      for (let i = 0; i < count; i++) {
        const board = document.createElement('div');
        board.className = 'bingo-board';
        if (boardBg) board.style.backgroundImage = `url(${boardBg})`;

        const header = document.createElement('div');
        header.className = 'board-header';
        header.style.backgroundColor = hColor;
        header.textContent = `${title} #${i + 1}`;

        const grid = document.createElement('div');
        grid.className = 'grid-table';
        grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;

        const shuffled = [...pool].sort(() => 0.5 - Math.random()).slice(0, needed);
        shuffled.forEach(item => {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (item.type === 'img') {
            cell.innerHTML = `<img src="${item.value}">`;
          } else {
            cell.textContent = item.value;
            cell.style.color = wColor;
            cell.style.fontFamily = font;
            cell.style.fontWeight = '800';
            cell.style.fontSize = size > 4 ? '1.1rem' : '1.4rem';
          }
          grid.appendChild(cell);
        });

        board.appendChild(header);
        board.appendChild(grid);
        boardsOut.appendChild(board);
      }

      pool.forEach(item => {
        const card = document.createElement('div');
        card.className = 'caller-card';
        if (item.type === 'img') {
          card.innerHTML = `<img src="${item.value}">`;
        } else {
          card.textContent = item.value;
          card.style.color = wColor;
          card.style.fontFamily = font;
          card.style.fontSize = '2rem';
          card.style.fontWeight = '800';
        }
        callerGrid.appendChild(card);
      });
      
      callerOut.appendChild(callerGrid);
      setLoading(false);
      boardsOut.scrollIntoView({ behavior: 'smooth' });
    }, 300);
  }

  const toBase64 = file => new Promise((res) => {
    const r = new FileReader();
    r.readAsDataURL(file);
    r.onload = () => res(r.result);
  });

  function setLoading(s) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; }
  function clearPool() { if(confirm("למחוק הכל?")) { pool = []; renderPreview(); } }
</script>

</body>
</html>
