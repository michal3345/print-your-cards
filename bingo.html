<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>מחולל משחק בינגו אישי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff7675;
      --primary-hover: #d63031;
      --secondary: #0984e3;
      --bg: #f8f9fe;
      --card-bg: #ffffff;
      --text: #2d3436;
      --main-font: 'Assistant', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--main-font);
    }

    body {
      background-color: var(--bg);
      margin: 0;
      padding: 30px 20px;
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #2d3436;
      margin-bottom: 25px;
      font-weight: 700;
    }

    /* אינדיקטור טעינה */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.9);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .bingo-loader {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
    }

    .bingo-square {
      width: 30px;
      height: 30px;
      background-color: var(--primary);
      border-radius: 6px;
      animation: bounce 0.6s infinite alternate;
    }

    .bingo-square:nth-child(2) { animation-delay: 0.2s; background-color: var(--secondary); }
    .bingo-square:nth-child(3) { animation-delay: 0.4s; background-color: #fdcb6e; }

    @keyframes bounce {
      to {
        transform: translateY(-20px);
      }
    }

    .creator-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      margin-bottom: 30px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
      color: #636e72;
    }

    input[type="text"], input[type="number"], input[type="color"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #dfe6e9;
      border-radius: 8px;
      font-size: 14px;
      background: white;
    }

    textarea {
      resize: vertical;
      height: 80px;
    }

    input[type="color"] {
      height: 42px;
      cursor: pointer;
      padding: 2px;
    }

    .bulk-drop-zone {
      border: 2px dashed var(--primary);
      background: #fff5f5;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 15px;
      transition: background 0.2s;
    }

    .bulk-drop-zone:hover {
      background: #ffe8e8;
    }

    .bulk-drop-zone p {
      margin: 0 0 4px 0;
      font-weight: 700;
      color: var(--primary);
      font-size: 15px;
    }

    .items-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
      padding: 8px;
      margin-bottom: 20px;
      border: 1px solid #edf2f7;
      border-radius: 10px;
      background: #fafbfc;
    }

    .item-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }

    .item-chip img {
      width: 28px;
      height: 28px;
      object-fit: cover;
      border-radius: 4px;
      margin-left: 6px;
    }

    .item-chip .btn-del {
      background: none;
      border: none;
      color: #d63031;
      cursor: pointer;
      font-weight: bold;
    }

    .actions-bar {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      flex: 1;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: var(--secondary);
    }
    .btn-secondary:hover { background: #076bba; }

    .bingo-boards-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    .bingo-board {
      background: white;
      border: 3px solid #2d3436;
      border-radius: 12px;
      padding: 15px;
      width: 18cm;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      page-break-after: always;
      page-break-inside: avoid;
    }

    .board-header {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 15px;
      padding: 8px;
      border-radius: 6px;
      color: white;
    }

    .grid-table {
      display: grid;
      width: 100%;
      gap: 6px;
    }

    .grid-cell {
      border: 2px solid #2d3436;
      border-radius: 8px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      font-size: 14px;
      font-weight: 600;
      background: #fff;
      overflow: hidden;
      word-break: break-word;
    }

    .grid-cell img {
      max-width: 90%;
      max-height: 80%;
      object-fit: contain;
    }

    .caller-section {
      margin-top: 40px;
    }

    .caller-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(14cm, 1fr));
      gap: 15px;
    }

    .caller-card {
      border: 2px dashed #6c5ce7;
      border-radius: 10px;
      background: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      height: 4cm;
      page-break-inside: avoid;
    }

    .caller-card img {
      max-height: 100%;
      max-width: 50%;
      object-fit: contain;
    }

    .caller-card .caller-text {
      font-size: 20px;
      font-weight: 700;
      color: #2d3436;
    }

    @media print {
      .no-print { display: none !important; }
      body { background: white; padding: 0; }
      .container { max-width: 100%; }
      .bingo-board { box-shadow: none; width: 100%; border-width: 2px; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
  <div class="bingo-loader">
    <div class="bingo-square"></div>
    <div class="bingo-square"></div>
    <div class="bingo-square"></div>
  </div>
  <p style="font-weight: bold; font-size: 18px; color: #2d3436;">מעלה תמונות למאגר, נא להמתין...</p>
</div>

<div class="container">
  <div class="no-print">
    <h1>🎲 מחולל משחק בינגו אישי</h1>

    <div class="creator-card">
      <div class="settings-grid">
        <div class="form-group">
          <label for="gameTitle">כותרת הלוח:</label>
          <input type="text" id="gameTitle" value="בינגו כיפי!">
        </div>

        <div class="form-group">
          <label for="gridSize">גודל הלוח:</label>
          <select id="gridSize">
            <option value="3">3x3 (9 משבצות)</option>
            <option value="4" selected>4x4 (16 משבצות)</option>
            <option value="5">5x5 (25 משבצות)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="boardCount">כמות לוחות להדפסה:</label>
          <input type="number" id="boardCount" value="5" min="1" max="50">
        </div>

        <div class="form-group">
          <label for="headerColor">צבע כותרת:</label>
          <input type="color" id="headerColor" value="#ff7675">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 15px;">
        <label for="textInput">הוספת מילים/מושגים (מופרדים בפסיק או בשורה חדשה):</label>
        <textarea id="textInput" placeholder="הכניסו מילים מופרדות בפסיקים..."></textarea>
        <button class="btn btn-secondary" style="margin-top: 5px; padding: 6px 12px; font-size: 13px;" onclick="addTextItems()">➕ הוסף מילים למאגר</button>
      </div>

      <div class="bulk-drop-zone" onclick="document.getElementById('fileInput').click()">
        <p>🖼️ לחצו או גררו לכאן תמונות להוספה למאגר</p>
        <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
      </div>

      <div class="form-group">
        <label>מאגר הפריטים הנוכחי (<span id="itemCount">0</span> פריטים):</label>
        <div class="items-preview-grid" id="itemsPreview"></div>
      </div>

      <div class="actions-bar">
        <button class="btn" onclick="generateBingo()">🎲 צור לוחות בינגו</button>
        <button class="btn btn-secondary" onclick="window.print()">🖨️ הדפס / שמור כ-PDF</button>
      </div>
    </div>
  </div>

  <div class="bingo-boards-container" id="boardsOutput"></div>
  <div class="caller-section" id="callerOutput"></div>
</div>

<script>
  let itemsPool = [];
  const fileInput = document.getElementById('fileInput');

  // יצירת תמונה מוקטנת לתצוגה המקדימה בלבד
  function createThumbnail(dataUrl, maxWidth = 120) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxWidth) {
            height *= maxWidth / width;
            width = maxWidth;
          }
        } else {
          if (height > maxWidth) {
            width *= maxWidth / height;
            height = maxWidth;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = dataUrl;
    });
  }

  fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files).filter(file => file.type.startsWith('image/'));
    if (files.length === 0) return;

    const loader = document.getElementById('loadingOverlay');
    loader.style.display = 'flex';

    for (const file of files) {
      await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = async (evt) => {
          const originalDataUrl = evt.target.result;
          const thumbDataUrl = await createThumbnail(originalDataUrl);

          itemsPool.push({
            type: 'image',
            value: originalDataUrl, // האיכות המקורית והגבוהה
            thumb: thumbDataUrl,    // גרסה קלה לתצוגה המקדימה בלבד
            name: file.name
          });
          resolve();
        };
        reader.readAsDataURL(file);
      });
    }

    updatePreview();
    loader.style.display = 'none';
    fileInput.value = '';
  });

  function addTextItems() {
    const rawText = document.getElementById('textInput').value;
    const tokens = rawText.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);
    tokens.forEach(text => {
      itemsPool.push({ type: 'text', value: text, name: text });
    });
    document.getElementById('textInput').value = '';
    updatePreview();
  }

  function removeItem(index) {
    itemsPool.splice(index, 1);
    updatePreview();
  }

  function updatePreview() {
    const container = document.getElementById('itemsPreview');
    const countEl = document.getElementById('itemCount');
    container.innerHTML = '';
    countEl.textContent = itemsPool.length;

    itemsPool.forEach((item, idx) => {
      const chip = document.createElement('div');
      chip.className = 'item-chip';
      if (item.type === 'image') {
        chip.innerHTML = `<span><img src="${item.thumb}"></span><button class="btn-del" onclick="removeItem(${idx})">✕</button>`;
      } else {
        chip.innerHTML = `<span>${item.value}</span><button class="btn-del" onclick="removeItem(${idx})">✕</button>`;
      }
      container.appendChild(chip);
    });
  }

  function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function generateBingo() {
    const size = parseInt(document.getElementById('gridSize').value);
    const requiredItems = size * size;
    const boardCount = parseInt(document.getElementById('boardCount').value);
    const title = document.getElementById('gameTitle').value;
    const color = document.getElementById('headerColor').value;

    if (itemsPool.length < requiredItems) {
      alert(`יש להזין לפחות ${requiredItems} פריטים במאגר עבור לוח בגודל ${size}x${size}! (כעת יש ${itemsPool.length})`);
      return;
    }

    const boardsOutput = document.getElementById('boardsOutput');
    const callerOutput = document.getElementById('callerOutput');
    boardsOutput.innerHTML = '';
    callerOutput.innerHTML = '';

    for (let b = 0; b < boardCount; b++) {
      const shuffled = shuffle(itemsPool).slice(0, requiredItems);
      
      const boardDiv = document.createElement('div');
      boardDiv.className = 'bingo-board';

      const headerDiv = document.createElement('div');
      headerDiv.className = 'board-header';
      headerDiv.style.backgroundColor = color;
      headerDiv.textContent = `${title} (#${b + 1})`;

      const gridDiv = document.createElement('div');
      gridDiv.className = 'grid-table';
      gridDiv.style.gridTemplateColumns = `repeat(${size}, 1fr)`;

      shuffled.forEach(item => {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        if (item.type === 'image') {
          cell.innerHTML = `<img src="${item.value}">`; // שימוש בתמונה המקורית באיכות מלאה
        } else {
          cell.textContent = item.value;
        }
        gridDiv.appendChild(cell);
      });

      boardDiv.appendChild(headerDiv);
      boardDiv.appendChild(gridDiv);
      boardsOutput.appendChild(boardDiv);
    }

    const callerTitle = document.createElement('h2');
    callerTitle.textContent = '📣 כרטיסי הגרלה למנחה המשחק';
    callerTitle.className = 'no-print';
    callerOutput.appendChild(callerTitle);

    const callerGrid = document.createElement('div');
    callerGrid.className = 'caller-cards-grid';

    itemsPool.forEach(item => {
      const card = document.createElement('div');
      card.className = 'caller-card';
      if (item.type === 'image') {
        card.innerHTML = `<img src="${item.value}"><div class="caller-text">${item.name}</div>`;
      } else {
        card.innerHTML = `<div class="caller-text">${item.value}</div>`;
      }
      callerGrid.appendChild(card);
    });

    callerOutput.appendChild(callerGrid);
  }
</script>

</body>
</html>
