<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>מחולל משחק דומינו אישי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Heebo:wght@400;700&family=Rubik:wght@400;700&family=Varela+Round&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #27ae60;
      --bg: #f5f7fa;
      --main-font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--main-font);
    }

    body {
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1, h2, h3 {
      text-align: center;
      color: #2c3e50;
    }

    .creator-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }

    .global-settings-box {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      background: white;
    }

    .bulk-drop-zone {
      border: 2px dashed var(--primary);
      background: #f0fff4;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s, border-color 0.2s;
    }

    .bulk-drop-zone.dragover {
      background: #dcffe4;
      border-color: #219150;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .item-box {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 8px;
      border: 1px dashed #bbb;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .image-preview-container {
      width: 100%;
      height: 100px;
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ddd;
      cursor: pointer;
    }

    .image-preview-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
      margin-top: 15px;
    }

    .btn:hover {
      background: #219150;
    }

    .btn-print {
      background: #2980b9;
      margin-bottom: 20px;
    }

    .btn-print:hover {
      background: #1c5980;
    }

    /* עיצוב אבני הדומינו */
    .domino-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      justify-content: center;
    }

    .domino-card {
      width: 12cm;
      height: 5cm;
      background: white;
      border: 3px solid #2c3e50;
      display: flex;
      flex-direction: row;
      position: relative;
      margin: 0 auto 15px auto;
      page-break-inside: avoid;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .corners-rounded .domino-card { border-radius: 12px; }
    .corners-sharp .domino-card { border-radius: 0px; }

    .domino-half {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
      overflow: hidden;
    }

    .domino-divider {
      width: 4px;
      background: #2c3e50;
      height: 100%;
    }

    .domino-half img {
      max-width: 100%;
      max-height: 3.2cm;
      object-fit: contain;
      border-radius: 6px;
    }

    .domino-half span {
      font-weight: bold;
      font-size: 16px;
      margin-top: 4px;
      color: #2c3e50;
    }

    @media print {
      .no-print { display: none !important; }
      body { background: white; padding: 0; }
      
      #printArea {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        width: 100%;
      }

      .domino-card {
        box-shadow: none;
        border: 2px solid #000;
      }

      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="no-print">
    <h1>מחולל משחק דומינו אישי</h1>
    
    <div class="creator-card">
      <div class="global-settings-box">
        <h3>⚙️ הגדרות גלובליות</h3>
        <div class="form-group">
          <label for="fontSelect">פונט המשחק:</label>
          <select id="fontSelect" onchange="changeGlobalFont(this.value)">
            <option value="system-ui, -apple-system, sans-serif">ברירת מחדל</option>
            <option value="'Assistant', sans-serif">Assistant</option>
            <option value="'Heebo', sans-serif">Heebo</option>
            <option value="'Rubik', sans-serif">Rubik</option>
            <option value="'Varela Round', sans-serif">Varela Round</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cardCorners">סגנון פינות האבנים:</label>
          <select id="cardCorners" onchange="changeGlobalCorners(this.value)">
            <option value="corners-rounded">פינות מעוגלות</option>
            <option value="corners-sharp">פינות ישרות</option>
          </select>
        </div>
      </div>

      <div class="bulk-drop-zone" id="bulkDropZone" onclick="document.getElementById('bulkFileInput').click()">
        <p>🖼️ טענו לכאן תמונות בבת אחת (מומלץ לפחות 4-6 תמונות)</p>
        <span>האבנים יווצרו אוטומטית ליצירת רצף משחק מלא</span>
        <input type="file" id="bulkFileInput" accept="image/*" multiple style="display: none;">
      </div>

      <h3>הפריטים בדומינו:</h3>
      <div class="items-grid" id="itemsGrid">
        <!-- פריטים יתווספו כאן -->
      </div>

      <button class="btn" style="background:#e67e22; margin-top:10px;" onclick="addItemBox()">➕ הוסף פריט נוסף</button>
      <button class="btn" onclick="generateDominoGame()">✨ צור אבני דומינו</button>
    </div>

    <button class="btn btn-print" onclick="window.print()">🖨️ הדפס / שמור כ-PDF</button>
  </div>

  <div id="printArea" class="corners-rounded domino-grid">
    <!-- אבני הדומינו יופיעו כאן -->
  </div>
</div>

<script>
  let itemsData = [];

  function changeGlobalFont(font) {
    document.documentElement.style.setProperty('--main-font', font);
  }

  function changeGlobalCorners(cornerClass) {
    document.getElementById('printArea').className = `domino-grid ${cornerClass}`;
  }

  function addItemBox(text = '', imgSrc = '') {
    const id = Date.now() + Math.random();
    const grid = document.getElementById('itemsGrid');
    const box = document.createElement('div');
    box.className = 'item-box';
    box.id = `item-${id}`;
    
    box.innerHTML = `
      <input type="text" placeholder="שם הפריט / מילה" value="${text}" class="item-text">
      <div class="image-preview-container" onclick="document.getElementById('img-${id}').click()">
        ${imgSrc ? `<img src="${imgSrc}">` : '<span style="font-size:12px; color:#888;">לחץ להוספת תמונה</span>'}
      </div>
      <input type="file" accept="image/*" id="img-${id}" style="display:none;" onchange="handleImageUpload(event, '${id}')">
      <button style="background:#e74c3c; color:white; border:none; border-radius:4px; cursor:pointer; padding:4px;" onclick="document.getElementById('item-${id}').remove()">הסר</button>
    `;
    grid.appendChild(box);
  }

  function handleImageUpload(event, id) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.querySelector(`#item-${id} .image-preview-container`);
        preview.innerHTML = `<img src="${e.target.result}">`;
      };
      reader.readAsDataURL(file);
    }
  }

  const bulkInput = document.getElementById('bulkFileInput');
  bulkInput.addEventListener('change', (e) => {
    Array.from(e.target.files).forEach(file => {
      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          addItemBox(file.name.split('.')[0], evt.target.result);
        };
        reader.readAsDataURL(file);
      }
    });
  });

  // הוספת 4 פריטים ריקים בהתחלה
  for(let i=0; i<4; i++) addItemBox();

  function generateDominoGame() {
    const boxes = document.querySelectorAll('.item-box');
    const items = [];

    boxes.forEach(box => {
      const text = box.querySelector('.item-text').value.trim();
      const img = box.querySelector('.image-preview-container img');
      const imgSrc = img ? img.src : '';

      if (text || imgSrc) {
        items.push({ text, imgSrc });
      }
    });

    if (items.length < 2) {
      alert('נא להזין לפחות 2 פריטים (תמונות או מילים) כדי ליצור משחק דומינו');
      return;
    }

    const printArea = document.getElementById('printArea');
    printArea.innerHTML = '';

    // יצירת זוגות אבני דומינו (כל שילוב זוגות ייחודי - Pair Matching)
    for (let i = 0; i < items.length; i++) {
      for (let j = i; j < items.length; j++) {
        const card = document.createElement('div');
        card.className = 'domino-card';

        const itemA = items[i];
        const itemB = items[j];

        card.innerHTML = `
          <div class="domino-half">
            ${itemA.imgSrc ? `<img src="${itemA.imgSrc}">` : ''}
            ${itemA.text ? `<span>${itemA.text}</span>` : ''}
          </div>
          <div class="domino-divider"></div>
          <div class="domino-half">
            ${itemB.imgSrc ? `<img src="${itemB.imgSrc}">` : ''}
            ${itemB.text ? `<span>${itemB.text}</span>` : ''}
          </div>
        `;

        printArea.appendChild(card);
      }
    }
  }
</script>

</body>
</html>
