<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>מחולל פאזלים מתמונה 🧩</title>
  <style>
    :root {
      --primary: #4a90e2;
      --bg: #f5f7fa;
      --main-font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--main-font);
    }

    body {
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1, h2, h3 {
      text-align: center;
      color: #2c3e50;
    }

    .creator-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }

    .global-settings-box {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .global-settings-title {
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 15px;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-divider {
      border: 0;
      height: 1px;
      background: #e2e8f0;
      margin: 25px 0;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .form-row .form-group {
      flex: 1;
      min-width: 150px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input[type="number"], input[type="color"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      background: white;
    }

    input[type="color"] {
      height: 45px;
      cursor: pointer;
      padding: 2px;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 15px;
    }

    .item-box {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      border: 1px dashed #bbb;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .image-preview-container {
      width: 100%;
      height: 140px;
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ddd;
      position: relative;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .image-preview-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-preview-placeholder {
      font-size: 13px;
      color: #888;
      text-align: center;
      padding: 5px;
    }

    .remove-img-btn {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(231, 76, 60, 0.9);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      z-index: 5;
      display: none;
    }

    .image-preview-container:hover .remove-img-btn {
      display: block;
    }

    .btn-wrapper {
      position: relative;
      margin-top: 15px;
    }

    .btn {
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #219150;
    }

    .btn-edit-mode {
      background: #e67e22;
    }

    .btn-edit-mode:hover {
      background: #d35400;
    }

    .btn-print {
      background: #2980b9;
      margin-bottom: 20px;
      margin-top: 20px;
    }

    .btn-print:hover {
      background: #1c5980;
    }

    .toast-popup {
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: #2c3e50;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      white-space: nowrap;
      z-index: 10;
    }

    .toast-popup.error {
      background: #e74c3c;
    }

    .toast-popup.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .puzzle-group {
      background: white;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      position: relative;
    }

    .puzzle-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    .puzzle-title {
      font-weight: bold;
      font-size: 16px;
      color: #2c3e50;
    }

    .puzzle-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .btn-action:hover {
      opacity: 0.85;
    }

    .btn-edit { background: #f39c12; color: white; }
    .btn-delete { background: #e74c3c; color: white; }

    /* Puzzle Display Area */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      justify-content: center;
    }

    .puzzle-card-pair {
      width: 9.0cm;
      height: 5.5cm;
      position: relative;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      overflow: hidden;
      page-break-inside: avoid;
    }

    .puzzle-card-pair img.full-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* SVG Separator Overlay */
    .puzzle-divider-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Loader Styles */
    .loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .loader-cards {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      animation: spin 2s linear infinite;
    }

    .loader-card {
      position: absolute;
      width: 35px;
      height: 35px;
      background: var(--primary);
      border-radius: 6px;
    }

    .loader-card:nth-child(1) { top: 0; left: 0; }
    .loader-card:nth-child(2) { top: 0; right: 0; }
    .loader-card:nth-child(3) { bottom: 0; right: 0; }
    .loader-card:nth-child(4) { bottom: 0; left: 0; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary);
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body { background: white; padding: 0; margin: 0; }
      .no-print { display: none !important; }

      .puzzle-group {
        border: none;
        padding: 0;
        margin: 0;
        display: contents;
      }

      .puzzle-toolbar { display: none !important; }

      #printArea {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 5mm;
        padding: 0;
        width: 100%;
        justify-items: center;
      }

      .cards-grid {
        display: contents;
      }

      .puzzle-card-pair {
        width: 9.0cm;
        height: 5.5cm;
        margin: 0;
        box-shadow: none;
        page-break-inside: avoid;
        break-inside: avoid;
      }

      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }

    .home-nav-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #ffffff;
      color: #2c3e50;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      border: 1px solid #e2e8f0;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .home-nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      background-color: #f8fafc;
      color: #2b6cb0;
    }

    @media print {
      .home-nav-btn { display: none !important; }
    }
  </style>
</head>
<body>

    <a href="index.html" class="home-nav-btn" title="חזרה לדף המשחקים">
        <span class="icon">🏠</span>
        <span>למשחקים אחרים</span>
    </a>

    <div class="container">
        <div class="no-print">
            <h1>מחולל פאזלים מתוך תמונה 🧩</h1>

            <div id="loaderOverlay" class="loader-overlay">
                <div class="loader-cards">
                    <div class="loader-card"></div>
                    <div class="loader-card"></div>
                    <div class="loader-card"></div>
                    <div class="loader-card"></div>
                </div>
                <div id="loaderText" class="loader-text">מכין את הפאזל...</div>
            </div>

            <div class="creator-card" id="formCard">

                <div class="global-settings-box">
                    <div class="global-settings-title">🎨 הגדרות עיצוב כלליות</div>

                    <!-- שורה 1: הגדרות מסגרת (סגנון, צבע, עובי) -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cornerStyle">סגנון פינות הקלף:</label>
                            <select id="cornerStyle">
                                <option value="8px">פינות מעוגלות</option>
                                <option value="0px">פינות ישרות (שפיצים)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="borderColor">צבע מסגרת הקלף:</label>
                            <input type="color" id="borderColor" value="#2c3e50">
                        </div>
                        <div class="form-group">
                            <label for="borderWidth">עובי מסגרת (px):</label>
                            <input type="number" id="borderWidth" value="2" min="0" max="10">
                        </div>
                    </div>

                    <!-- שורה 2: הגדרות קו מפריד (סגנון, צבע, עובי) -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cutStyle">סגנון חיתוך הפאזל:</label>
                            <select id="cutStyle">
                                <option value="puzzle">חיתוך פאזל קלאסי</option>
                                <option value="straight">פס ישר</option>
                                <option value="wavy">קו גלי</option>
                                <option value="zigzag">זיגזג</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="dividerColor">צבע קו מפריד (חיתוך):</label>
                            <input type="color" id="dividerColor" value="#ffffff">
                        </div>
                        <div class="form-group">
                            <label for="dividerWidth">עובי קו מפריד (px):</label>
                            <input type="number" id="dividerWidth" value="3" min="1" max="10">
                        </div>
                    </div>
                </div>

                <hr class="section-divider">

                <h2 id="formTitle">העלאת תמונות לפאזלים</h2>

                <div class="form-group">
                    <label for="cardCount">כמות פאזלים ליצירה בערכה זו:</label>
                    <input type="number" id="cardCount" value="4" min="1" max="50" onchange="generateCardInputs()" oninput="generateCardInputs()">
                </div>

                <div id="cardsInputContainer" class="items-grid">
                    <!-- ייקלט דינמית באמצעות JS -->
                </div>

                <div class="btn-wrapper">
                    <div class="toast-popup" id="toastPopup">✨ ערכת הפאזל נוצרה בהצלחה!</div>
                    <button class="btn" id="submitBtn" onclick="savePuzzleSet()">צור ערכת פאזלים</button>
                </div>
            </div>

            <button class="btn btn-print" onclick="prepareAndPrint()">🖨️ הדפס / שמור כ-PDF</button>
        </div>

        <div id="printArea">
            <!-- ערכות הפאזלים יוצגו כאן -->
        </div>
    </div>

    <script>
        let puzzleSetsList = [];
        let editingIndex = null;
        let setCardImages = {}; // Format: { "cardIndex": dataUrl }

        function generateCardInputs() {
            const countInput = document.getElementById('cardCount');
            let count = parseInt(countInput.value);
            if (isNaN(count) || count < 1) count = 1;

            const container = document.getElementById('cardsInputContainer');
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const itemBox = document.createElement('div');
                itemBox.className = 'item-box';
                itemBox.innerHTML = `
                    <label>פאזל #${i + 1}</label>
                    <div class="image-preview-container" id="preview_${i}" onclick="triggerFileInput(${i})">
                        <button type="button" class="remove-img-btn" id="remove_btn_${i}" onclick="removeImage(event, ${i})">🗑️ הסר תמונה</button>
                        <span class="image-preview-placeholder" id="placeholder_${i}">לחץ או גרור תמונה לכאן</span>
                    </div>
                    <input type="file" accept="image/*" id="img_${i}" style="display:none;" onchange="handleImageUpload(event, ${i})">
                `;
                container.appendChild(itemBox);

                if (setCardImages[i]) {
                    updateImagePreviewUI(i, setCardImages[i]);
                }

                setupDragAndDrop(i);
            }
        }

        function triggerFileInput(cardIdx) {
            document.getElementById(`img_${cardIdx}`).click();
        }

        function handleImageUpload(e, cardIdx) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    setCardImages[cardIdx] = evt.target.result;
                    updateImagePreviewUI(cardIdx, evt.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage(e, cardIdx) {
            e.stopPropagation();
            delete setCardImages[cardIdx];
            document.getElementById(`img_${cardIdx}`).value = '';
            
            const preview = document.getElementById(`preview_${cardIdx}`);
            preview.querySelectorAll('img').forEach(img => img.remove());
            
            const removeBtn = document.getElementById(`remove_btn_${cardIdx}`);
            if (removeBtn) removeBtn.style.display = 'none';

            const placeholder = document.getElementById(`placeholder_${cardIdx}`);
            if (placeholder) placeholder.style.display = 'block';
        }

        function updateImagePreviewUI(cardIdx, imgSrc) {
            const preview = document.getElementById(`preview_${cardIdx}`);
            
            preview.querySelectorAll('img').forEach(img => img.remove());
            
            const imgEl = document.createElement('img');
            imgEl.src = imgSrc;
            preview.appendChild(imgEl);

            const removeBtn = document.getElementById(`remove_btn_${cardIdx}`);
            if (removeBtn) removeBtn.style.display = 'block';

            const placeholder = document.getElementById(`placeholder_${cardIdx}`);
            if (placeholder) placeholder.style.display = 'none';
        }

        function setupDragAndDrop(cardIdx) {
            setTimeout(() => {
                const preview = document.getElementById(`preview_${cardIdx}`);
                if (!preview) return;

                ['dragenter', 'dragover'].forEach(eventName => {
                    preview.addEventListener(eventName, (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        preview.style.borderColor = 'var(--primary)';
                    }, false);
                });

                ['dragleave', 'drop'].forEach(eventName => {
                    preview.addEventListener(eventName, (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        preview.style.borderColor = '#ddd';
                    }, false);
                });

                preview.addEventListener('drop', (e) => {
                    const files = e.dataTransfer.files;
                    if (files.length > 0 && files[0].type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            setCardImages[cardIdx] = evt.target.result;
                            updateImagePreviewUI(cardIdx, evt.target.result);
                        };
                        reader.readAsDataURL(files[0]);
                    }
                });
            }, 50);
        }

        function triggerToast(message, isError = false) {
            const toast = document.getElementById('toastPopup');
            toast.textContent = message;
            toast.className = 'toast-popup' + (isError ? ' error' : '');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showLoader(text, duration = 1200) {
            const loader = document.getElementById('loaderOverlay');
            document.getElementById('loaderText').textContent = text;
            loader.style.display = 'flex';
            return new Promise(resolve => setTimeout(() => {
                loader.style.display = 'none';
                resolve();
            }, duration));
        }

        async function savePuzzleSet() {
            const count = parseInt(document.getElementById('cardCount').value) || 1;
            const cornerStyle = document.getElementById('cornerStyle').value;
            const borderColor = document.getElementById('borderColor').value;
            const borderWidth = document.getElementById('borderWidth').value || 2;
            const dividerColor = document.getElementById('dividerColor').value;
            const dividerWidth = document.getElementById('dividerWidth').value || 3;
            const cutStyle = document.getElementById('cutStyle').value;

            let imagesList = [];
            for (let i = 0; i < count; i++) {
                const imgSrc = setCardImages[i] || '';

                if (!imgSrc) {
                    triggerToast(`⚠️ פאזל #${i + 1} ריק! יש להעלות תמונה.`, true);
                    return;
                }

                imagesList.push(imgSrc);
            }

            await showLoader(editingIndex !== null ? 'מעדכן ערכת פאזל...' : 'יוצר ערכת פאזל חדשה...');

            const setData = {
                cornerStyle, borderColor, borderWidth, dividerColor, dividerWidth, cutStyle, images: imagesList
            };

            if (editingIndex !== null) {
                puzzleSetsList[editingIndex] = setData;
                triggerToast('✨ הערכה עודכנה בהצלחה!');
                resetForm();
            } else {
                puzzleSetsList.push(setData);
                triggerToast('✨ הערכה נוצרה בהצלחה!');
                resetForm();
            }

            renderAllSets();
        }

        function resetForm() {
            editingIndex = null;
            setCardImages = {};
            document.getElementById('cardCount').value = '4';
            generateCardInputs();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'צור ערכת פאזלים';
            submitBtn.classList.remove('btn-edit-mode');
            document.getElementById('formTitle').textContent = 'העלאת תמונות לפאזלים';
        }

        function editSet(index) {
            editingIndex = index;
            const set = puzzleSetsList[index];

            document.getElementById('cornerStyle').value = set.cornerStyle;
            document.getElementById('borderColor').value = set.borderColor;
            document.getElementById('borderWidth').value = set.borderWidth || 2;
            document.getElementById('dividerColor').value = set.dividerColor;
            document.getElementById('dividerWidth').value = set.dividerWidth || 3;
            document.getElementById('cutStyle').value = set.cutStyle;

            document.getElementById('cardCount').value = set.images.length;
            
            setCardImages = {};
            set.images.forEach((img, i) => {
                setCardImages[i] = img;
            });

            generateCardInputs();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'עדכן ערכה';
            submitBtn.classList.add('btn-edit-mode');
            document.getElementById('formTitle').textContent = `עריכת ערכת פאזל #${index + 1}`;
            document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
        }

        function deleteSet(index) {
            if (confirm('האם למחוק ערכה זו?')) {
                puzzleSetsList.splice(index, 1);
                if (editingIndex === index) resetForm();
                renderAllSets();
            }
        }

        function getCutPathSVG(style, strokeColor, strokeWidth = 3) {
            let pathD = "";
            if (style === 'straight') {
                pathD = "M 50,0 L 50,100";
            } else if (style === 'wavy') {
                pathD = "M 50,0 Q 58,25 50,50 T 50,100";
            } else if (style === 'zigzag') {
                pathD = "M 50,0 L 44,20 L 56,40 L 44,60 L 56,80 L 50,100";
            } else { // puzzle classic
                pathD = "M 50,0 L 50,35 C 40,35 40,65 50,65 L 50,100";
            }

            return `
                <svg class="puzzle-divider-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path d="${pathD}" fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth}" vector-effect="non-scaling-stroke"/>
                </svg>
            `;
        }

        function renderAllSets() {
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = '';

            puzzleSetsList.forEach((set, sIndex) => {
                const groupWrapper = document.createElement('div');
                groupWrapper.className = 'puzzle-group';

                let cardsHTML = '';
                set.images.forEach((imgSrc) => {
                    const svgDivider = getCutPathSVG(set.cutStyle, set.dividerColor, set.dividerWidth || 3);

                    cardsHTML += `
                        <div class="puzzle-card-pair" style="border-radius: ${set.cornerStyle}; border: ${set.borderWidth}px solid ${set.borderColor};">
                            <img src="${imgSrc}" class="full-card-img">
                            ${svgDivider}
                        </div>
                    `;
                });

                groupWrapper.innerHTML = `
                    <div class="puzzle-toolbar">
                        <div class="puzzle-title">ערכת פאזלים #${sIndex + 1} (${set.images.length} פאזלים)</div>
                        <div class="puzzle-actions">
                            <button class="btn-action btn-edit" onclick="editSet(${sIndex})">✏️ ערוך</button>
                            <button class="btn-action btn-delete" onclick="deleteSet(${sIndex})">🗑️ מחק</button>
                        </div>
                    </div>
                    <div class="cards-grid">
                        ${cardsHTML}
                    </div>
                `;

                printArea.appendChild(groupWrapper);
            });
        }

        async function prepareAndPrint() {
            await showLoader('מכין את הקבצים להדפסה...', 2000);
            window.print();
        }

        window.onload = function() {
            generateCardInputs();
        };
    </script>
</body>
